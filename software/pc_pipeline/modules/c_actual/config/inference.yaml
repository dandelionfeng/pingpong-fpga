# C 端感知 —— 正式推理配置（C_ACTUAL_INTERFACE_V2_4）
#
# 本文件是 C++ 引擎与 Python 侧共享的唯一阈值来源。
# 接口已冻结：修改阈值不影响接口，但换模型权重时必须保持字段含义不变。

version: C_ACTUAL_INTERFACE_V2_4

input:
  # 唯一允许的输入格式
  format: GRAY8                 # OpenCV CV_8UC1，单通道 8 位
  gray3_conversion: internal    # 调用方不需要自己做 gray3 / resize / normalize
  coordinates: original_image   # 所有输出坐标均为原图坐标
  size: dynamic                 # 尺寸动态读取，不写死；实际目标 1280x720 per eye

unified:
  # V2.4 可选路径：一个 3 类 ONNX 同时给出 hand 与 racket，每帧只跑一次 YOLO。
  # 一旦设置，下面的 hand.model / racket.model 会被忽略（不必提供）。
  # 类别顺序是模型契约的一部分：0=ball, 1=hand, 2=racket，加载时校验，不符即报
  # UNIFIED_MODEL_CLASS_MISMATCH，绝不把 racket 当 hand 输出。
  enabled: false                # CLI 以 --unified-model 打开；此处仅作文档
  model: models/pingpong_yolov8n_gray_3cls_960.onnx
  classes:
    0: ball                     # 保留但不输出：ball 唯一来源仍是 BallTrack
    1: hand
    2: racket
  input_size: 960               # 由该 ONNX 自己的 input shape 读取，此处仅记录
  hand_conf: 0.25               # 与下面的 hand.conf 同一语义
  racket_conf: 0.30             # 与下面的 racket.conf 同一语义
  ball_class_emitted: false     # 冻结接口里 ball 只有一个来源

ball:
  backend: balltrack            # balltrack | yolo
  heatmap_threshold: 0.5        # 官方 inference.py 默认值，未调优
  seq_len: 4                    # 官方时序窗口：用 i-4..i-1 预测第 i 帧
  background_mode: first_frame  # ONLINE APPROXIMATION（官方参考实现是整段视频中位数）
  requires_median_background: true
  model: models/balltrack_tracknetv3.onnx
  # 回退后端（BallTrack 不可用时）
  yolo_fallback:
    base_conf: 0.02
    ball_conf: 0.05

hand:
  backend: yolo
  # V2.4：默认交付统一三类模型；此段保留为分离模型（legacy）模式，
  # 未给 --unified-model 时仍然完全按 V2.3 行为工作。
  model: models/hand_yolov8n_gray_final_v3_960.onnx
  classes:
    0: hand
  # 1 类 hand bbox detector。不区分 toss/racket/left/right —— 角色判断属于 B。
  conf: 0.25
  base_conf: 0.02               # 推理下限：一次推理缓存全部候选
  # 输入尺寸由该 ONNX 自己的 input shape 自动读取（当前=960），
  # 不需要也不应该在配置里指定；hand 与 racket 各自独立。

racket:
  backend: yolo
  model: models/racket_yolov8n_gray.onnx
  classes:
    0: ball
    1: racket
  class_to_use: 1               # 本 ONNX 是多类，C++ 只取 racket 类
  conf: 0.30
  base_conf: 0.02
  # 同上：racket 使用它自己 ONNX 的输入尺寸（当前=640）

detector_common:
  # imgsz 已移除：每个检测器从自己的 ONNX input shape 读取，
  # 禁止用单一全局值同时控制 hand(960) 和 racket(640)。
  iou: 0.70
  max_det: 100
  device: cpu                   # cpu | cuda

pose:
  # OPTIONAL / LEGACY DIAGNOSTIC —— 不是正式 runtime 必需文件
  required: false
  note: >
    正式 ball/hand/racket 输出必须在完全不运行 Pose 的情况下成立。
    Pose 仅作为可选诊断，供 B 在需要 wrist 时额外使用。

temporal:
  # 正式 Captain-facing DetectorBackend 只输出当前帧 observation。
  # PREDICTED_ONLY 永远不会作为 detector detection 进入 boxes。
  ball_state_values: [DETECTED, WARMUP, DROPOUT, INVALID]
  predicted_only_emitted_as_detection: false

association:
  status_values: [HEURISTIC, UNKNOWN]
  is_ground_truth: false
  note: >
    hand 角色（持拍手 / 抛球手）、离手判定、trajectory / Kalman / 合法性
    全部由 B 负责。C 不做 hand role association，也不做 Kalman。

notes:
  - 接口已冻结，见 INTERFACE_CONTRACT.md。
  - YOLO 输出前 4 通道是像素坐标，做 RKNN INT8 时不要量化这 4 个通道。
  - 摄像头曝光策略暂不调整。
